<!DOCTYPE html>
<html>
<head>
  <title>Lantern</title>
</head>
<body>
  <h1>Lantern 🔦</h1>
  <button onclick="scan()">Scan</button>
  <ul id="list"></ul>

<script>
async function scan() {
  const list = document.getElementById('list');

  // 🔄 loading
  list.innerHTML = "<li>🔄 Scansione in corso...</li>";

  try {
    const res = await fetch('/scan');
    const data = await res.json();

    list.innerHTML = "";

    if (!data.length) {
      list.innerHTML = "<li>Nessun dispositivo trovato</li>";
      return;
    }

    data.forEach(d => {
      d.services.forEach(s => {
        const url = `http://${d.ip}:${s.port}`;
        const li = document.createElement('li');

        li.innerHTML = `
          <a href="${url}" target="_blank">
            ${url}
          </a> ${s.title ? "- " + s.title : ""}
        `;

        list.appendChild(li);
      });
    });

  } catch (err) {
    list.innerHTML = "<li>❌ Errore durante lo scan</li>";
  }
}
</script>
</body>
</html>
